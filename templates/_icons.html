{% macro mascot(size=72, patch=False) %}
<svg class="blink-mascot" width="{{ size }}" height="{{ size }}" viewBox="0 0 100 100" role="img" aria-label="Blink, the EyeQuest mascot">
  <path d="M50 6c6 0 9 5 8 10-3-2-6-3-8-3s-5 1-8 3c-1-5 2-10 8-10z" fill="#ff6b5e"/>
  <circle cx="50" cy="54" r="40" fill="#5b4bdb"/>
  <circle cx="50" cy="50" r="28" fill="#fff"/>
  <g class="pupil">
    <circle cx="50" cy="50" r="15" fill="#ffb627"/>
    <circle cx="50" cy="50" r="8" fill="#2c2a4a"/>
    <circle cx="54" cy="46" r="3" fill="#fff"/>
  </g>
  {% if patch %}
  <path d="M14 30 86 72" stroke="#2c2a4a" stroke-width="4"/>
  <circle cx="50" cy="50" r="29" fill="#2c2a4a"/>
  {% endif %}
  <path d="M40 87q10 7 20 0" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
</svg>
{% endmacro %}
{% macro flame() %}<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M13 2c1 4-1 6-3 8-1-1-1-3-1-4-3 2-5 6-5 9a8 8 0 0 0 16 0c0-5-4-9-7-13z"/></svg>{% endmacro %}
{% macro star(cls='') %}<svg class="{{ cls }}" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="m12 3 2.7 5.8 6.3.8-4.6 4.3 1.2 6.3-5.6-3.1-5.6 3.1 1.2-6.3L3 9.6l6.3-.8z"/></svg>{% endmacro %}
{% macro lock() %}<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5zm-3 8V7a3 3 0 0 1 6 0v3z"/></svg>{% endmacro %}
{% macro eye() %}<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 5C7 5 3 8.5 1 12c2 3.500 6 7 11 7s9-3.500 11-7c-2-3.500-6-7-11-7zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8z"/></svg>{% endmacro %}
{% macro check() %}<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" d="m5 13 4.500 4.500L19 7"/></svg>{% endmacro %}
